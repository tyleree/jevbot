# jevbot - news entity masking dictionaries (DESIGN.md 5.8, loaded by config.load_mask_terms).
#
# Every listed term is replaced, longest first, case-insensitively and word-bounded, by its group's `replacement`
# phrase. The generic patterns of 5.8 step 4a (titled people, exchange-qualified tickers, `$TICKER` cashtags, the
# item's own symbols) use the same phrases. Countries and regions are deliberately NOT listed: they carry meaning and
# leak nothing (G9 - informative institutional tokens are generalised, not deleted). Dates, numbers, percentages and
# residual proper nouns are handled by rules, not by this file.
#
# Editing this file changes `mask_version` (= sha256(config.MASK_RULES_VERSION + these bytes)[:12]) and therefore
# `state_config_hash`, so a run recorded under the old dictionary is never silently mixed with a new one.
#
# Rules the loader enforces: only the eight groups below, a non-empty `terms` array per group, and no term listed
# twice (case-insensitively, within or across groups - the replacement would be ambiguous).

[funds]
replacement = "the fund"
terms = [
  "SPDR S&P 500 ETF Trust",
  "SPDR S&P 500 ETF",
  "SPDR S&P 500",
  "SPY",
  "Invesco QQQ Trust",
  "Invesco QQQ",
  "QQQ",
  "iShares Russell 2000 ETF",
  "iShares Russell 2000",
  "IWM",
  "State Street Global Advisors",
  "SPDR",
  "iShares",
]

