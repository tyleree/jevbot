# jevbot - uv project (DESIGN.md section 1.1; D26, D29).
# The only package index is PyPI: never add [[tool.uv.index]], extra-index-url or find-links here (doctor and
# tests/guards/test_forbidden_config.py fail on any extra index).

[project]
name = "jevbot"
version = "0.1.0"
description = "Options trading bot (historical backtest + Alpaca PAPER trading only) whose decision core is TypeSafe AI's Jev model."
requires-python = ">=3.12,<3.13"
dependencies = [
    # The runtime list is CLOSED (DESIGN 1.1): nothing else may be added. The two vendor SDKs carry EXACT pins;
    # every other distribution (incl. the transitive `websockets`, `httpx2`) is pinned by uv.lock.
    "typesafe-sdk==0.6.0",
    "alpaca-py==0.44.0",
    "numpy>=2.0",
    "pandas>=2.2,<3",              # DESIGN's chain dtypes (datetime64[ns], object strings) are pandas-2 semantics
    "pyarrow>=17",
    "scipy>=1.13",
    "msgspec>=0.19",
    "exchange-calendars>=4.5",
    "typer>=0.12",
    "matplotlib>=3.9",
]

[project.scripts]
jevbot = "jevbot.cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",             # the coverage floors of DESIGN 1.1 (90% on the safety-critical modules, 80% elsewhere)
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevbot"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 140
src = ["src", "."]
extend-exclude = ["docs", "deploy", "runs"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # import order
    "B",           # bugbear
    "UP",          # pyupgrade (py312)
    "C4",          # comprehensions
    "DTZ",         # naive datetimes: every datetime in this project is tz-aware UTC (DESIGN Conventions)
    "RUF",
]
ignore = [
    "E501",        # contract blocks are copied verbatim from DESIGN.md with their long trailing comments; `ruff format` wraps code
    "RUF001", "RUF002", "RUF003",   # ambiguous unicode in strings / docstrings / comments (quoted vendor and spec text)
    "RUF012",      # msgspec.Struct copies mutable defaults; ClassVar annotations would change struct semantics
]

[tool.ruff.lint.isort]
known-first-party = ["jevbot", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------------------------------------------------
# mypy (strict). `uv run mypy` checks the package; tests are exercised by pytest.
# ---------------------------------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/jevbot"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
show_error_codes = true

[[tool.mypy.overrides]]
# DESIGN 1.1: untyped third-party packages. (scipy ships no inline types either.)
module = [
    "pandas", "pandas.*",
    "pyarrow", "pyarrow.*",
    "exchange_calendars", "exchange_calendars.*",
    "alpaca", "alpaca.*",
    "scipy", "scipy.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------------------------------------------------
# pytest. `pythonpath = ["."]` puts the repository root on sys.path so that `tests.fixtures.<double>` imports resolve
# (tests/ and tests/fixtures/ are namespace packages: no __init__.py is owned by any work package). importlib import mode
# keeps test modules out of sys.path, so equal basenames in different test directories cannot collide.
# ---------------------------------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
markers = [
    "slow: long-running test (performance budgets, large property sweeps)",
]

# ---------------------------------------------------------------------------------------------------------------------
# coverage (run as: uv run pytest --cov). Floors per DESIGN 1.1: 90% on risk, killswitch, reconcile, fills, portfolio,
# ledger, rules, canon, ids, structmath; 80% elsewhere. `fail_under` is the project-wide 80% floor; the 90% modules are
# checked per file from the JSON / terminal report by the integration gate.
# ---------------------------------------------------------------------------------------------------------------------
[tool.coverage.run]
source = ["jevbot"]
branch = true

[tool.coverage.paths]
source = ["src/jevbot", "*/site-packages/jevbot"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "@overload",
    "\\.\\.\\.$",
]
